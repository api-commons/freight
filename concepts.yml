context: freight
name: Freight and TMS
intro: >-
  The common freight vocabulary -- the loads that move by truck, the freight quotes that price
  them, the tenders that offer them to carriers and the trucking carriers who haul them --
  distilled from the APIs that already exist. Parcel shipping belongs to the shipping context.
tags: [Freight, Trucking, TMS, Transportation Management, Freight Brokerage, LTL, Truckload, Logistics]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, load_id, shipment_id, external_id, reference]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, load_status, shipment_status, tender_status]
  origin: [pickup, pickup_location, shipper, origin_address, from, pickup_address, stops_origin]
  destination: [delivery, delivery_location, consignee, destination_address, to, drop, delivery_address]
  pickup_date: [pickup_at, ship_date, pickup_window_start, earliest_pickup, pickup_datetime]
  delivery_date: [delivery_at, delivery_window_end, latest_delivery, delivery_datetime]
  equipment_type: [equipment, trailer_type, mode, service_level, truck_type]
  weight: [total_weight, gross_weight, weight_lbs]

concepts:
  load:
    segments: [loads, load, freight_shipments, "shipments@freight|ltl|tms|truckload", orders@tms|freight, bookings@freight|ltl]
    aliases:
      stops: [stop_list, waypoints, legs]
      carrier_id: [carrier, assigned_carrier, carrier_scac, scac]
      rate: [price, total_rate, linehaul, amount, cost]
      reference_numbers: [references, po_number, bol_number, pro_number]
  # freight_quote and tender were measured and dropped: 0 and 2 providers.
  freight_carrier:
    requires: [load]
    path: /freight-carriers
    segments: [carriers, carrier, trucking_companies, motor_carriers]
    aliases:
      scac: [carrier_code, scac_code]
      dot_number: [usdot, usdot_number, dot]
      mc_number: [mc, docket_number, mc_docket]

duplicates:
  kargo: [kargo-ai]

findings:
  - "A load agrees on its weight, commodity, status and id: what is moving and how heavy, not
    where -- origin, destination and dates are each nested differently (stops, pickup/delivery
    objects, addresses)."
  - "Freight publishes thinly as OpenAPI (205 providers in the cohort, 13 mapped). Brokers, TMS and
    load boards trade quotes and tenders over EDI and portals more than over published APIs."
decisions:
  - "Loads cover freight shipments, TMS orders and freight bookings; parcel shipments are
    shipping's."
  - "Carriers are `/freight-carriers` (trucking companies identified by SCAC, DOT and MC numbers);
    shipping's carriers are parcel networks."
  - "Freight quotes and tenders were measured and dropped."
  - "Duplicates merged: Kargo."
